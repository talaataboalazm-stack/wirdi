name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www/sounds
          cp index.html www/
          cp *.mp3 www/sounds/

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK and release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Sign AAB for Google Play
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar wirdi-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed AAB for Google Play
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-aab
          path: wirdi-release-signed.aab

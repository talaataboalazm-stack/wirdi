<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وردي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
html{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}

/* Layout: one-column phone app. Sticky date/place bar on top, one panel per tab, fixed five-tab bar at the bottom. Teal ink with a gold marker for "next / now". */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2EAE6; --fg:#12221E; --muted:#52645E; --line:#CBD7D2;
  --accent:#0E5A52; --accent-fg:#FFFFFF; --gold:#8A5F0C; --gold-bg:#F5E9CC; --ok:#2B7A4B; --overlay:rgba(8,20,17,.58);
  --f-display:'Reem Kufi','Noto Kufi Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-text:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --scale:1;
  --fs-xs:calc(12.5px*var(--scale)); --fs-s:calc(14px*var(--scale)); --fs:calc(16px*var(--scale));
  --fs-l:calc(19px*var(--scale)); --fs-xl:calc(26px*var(--scale)); --fs-hero:calc(40px*var(--scale)); --fs-zk:calc(25px*var(--scale));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1614; --surface:#13221F; --surface2:#1B2E2A; --fg:#E5EEEA; --muted:#9BB0A9; --line:#27403A;
  --accent:#5CC0AF; --accent-fg:#06201C; --gold:#E0B85C; --gold-bg:#2E2713; --ok:#6DD29A; --overlay:rgba(0,0,0,.66); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1614; --surface:#13221F; --surface2:#1B2E2A; --fg:#E5EEEA; --muted:#9BB0A9; --line:#27403A;
  --accent:#5CC0AF; --accent-fg:#06201C; --gold:#E0B85C; --gold-bg:#2E2713; --ok:#6DD29A; --overlay:rgba(0,0,0,.66); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.top .hijri{font-family:var(--f-display);font-size:var(--fs-l);font-weight:700}
.top .greg,.top .place{font-size:var(--fs-s);color:var(--muted)}
.top .place{text-align:left}

section.panel{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:var(--fs-l)}
.sec-h .hint{font-size:var(--fs-s);color:var(--muted)}
.hint{font-size:var(--fs-s);color:var(--muted)}

.next{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px}
.next .lbl{font-size:var(--fs-s);opacity:.85}
.next .nm{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:700}
.next .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.next .cd{font-family:var(--f-display);font-size:var(--fs-hero);line-height:1.1;letter-spacing:.02em;direction:ltr;font-variant-numeric:tabular-nums}
.next .at{font-size:var(--fs-l)}

.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.strip div{text-align:center;padding:10px 2px;border-radius:12px;background:var(--surface2);font-size:var(--fs-s)}
.strip b{display:block;font-weight:500;color:var(--muted);font-size:var(--fs-xs)}
.strip .on{background:var(--gold-bg);color:var(--gold);outline:1.5px solid var(--gold)}
.strip .on b{color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:var(--fs-s);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
button.chip{min-height:36px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right}
.list .item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:var(--fs-s);color:var(--muted)}
.item .grow{min-width:0;flex:1}
.pill{background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

.btn{min-height:46px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:38px;padding:6px 14px;font-size:var(--fs-s)}
.btn.danger{border-color:var(--gold);color:var(--gold);background:transparent}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.zk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.zk.done{opacity:.72}
.zk h3{font-size:var(--fs);color:var(--accent)}
.zk-text{font-family:var(--f-text);font-size:var(--fs-zk);line-height:2.05;text-wrap:pretty}
.zk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:var(--fs-xs);color:var(--muted)}
.zk-count{min-height:54px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:var(--fs-l);width:100%}
.zk.done .zk-count{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 4px;font-size:var(--fs-xs);text-decoration:underline;min-height:32px}

.tas{display:flex;flex-direction:column;align-items:center;gap:14px}
.tas-phrase{font-family:var(--f-text);font-size:var(--fs-zk);text-align:center;line-height:1.9}
.tas-btn{width:min(230px,62vw);aspect-ratio:1;border-radius:50%;border:4px solid var(--accent);background:var(--surface);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tas-btn:active{background:var(--surface2)}
.tas-btn .n{font-family:var(--f-display);font-size:calc(58px*var(--scale));line-height:1}
.tas-btn .g{font-size:var(--fs-s);color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:var(--fs-s);color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=time],select{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
input[type=file]{width:100%;font-size:var(--fs-s)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row2{display:flex;align-items:center;gap:10px}
.row2 select{flex:1;min-width:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.block{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.rule{border-top:1px solid var(--line);padding-top:20px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:54px;color:var(--muted);font-size:var(--fs-xs);border-radius:10px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--surface2)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.alert{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px}
.alert .box{background:var(--surface);border-radius:20px;padding:26px 22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.alert h2{font-size:var(--fs-xl)}
.alert .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.playbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:26;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 8px 6px 18px;display:flex;align-items:center;gap:14px;font-size:var(--fs-s);max-width:calc(100vw - 32px)}
.playbar button{border:0;border-radius:999px;background:var(--bg);color:var(--fg);padding:6px 14px;min-height:36px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:var(--fs-s);max-width:calc(100vw - 32px);text-align:center}
.foot{font-size:var(--fs-xs);color:var(--muted);text-align:center;padding-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.form{grid-template-columns:1fr}.next .cd{font-size:calc(34px*var(--scale))}}
</style>
</head>
<body>


<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div><div class="hijri" id="hijri"></div><div class="greg" id="greg"></div></div>
    <div class="place" id="place"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" dir="rtl" aria-label="التنقل">
  <div class="in" id="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>الرئيسية</button>

    <button data-tab="prayer"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>الصلاة</button>
    <button data-tab="wird"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M9 8h6"/></svg>الورد</button>
    <button data-tab="alerts"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg>التنبيهات</button>
  </div>
</nav>
<div id="playbar" class="playbar" hidden><span id="playlbl"></span><button data-act="stopSound">إيقاف</button></div>
<div id="alert" class="alert" hidden role="alertdialog" aria-live="assertive"><div class="box" id="alertbox"></div></div>
<div id="toast" class="toast" hidden></div>

var KURSI='اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ';

var FAL='قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ';

/* ---------- prayer maths (no network needed) ---------- */
var D2R=Math.PI/180,R2D=180/Math.PI;
function sin(d){return Math.sin(d*D2R)}function cos(d){return Math.cos(d*D2R)}function tan(d){return Math.tan(d*D2R)}
function asin(x){return Math.asin(x)*R2D}function acos(x){return Math.acos(x)*R2D}function atan2(y,x){return Math.atan2(y,x)*R2D}function acot(x){return Math.atan(1/x)*R2D}
function fix(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a}
function julian(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){var D=jd-2451545.0,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;return {decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)}}
function calc(jd,lat,lng,tz,m,asrF,ram){
  function mid(t){return fix(12-sunPos(jd+t).eqt,24)}
  function sat(angle,t,ccw){var decl=sunPos(jd+t).decl,noon=mid(t),V=acos((-sin(angle)-sin(decl)*sin(lat))/(cos(decl)*cos(lat)))/15;return noon+(ccw?-V:V)}
  function asrT(f,t){var decl=sunPos(jd+t).decl;return sat(-acot(f+tan(Math.abs(lat-decl))),t,false)}
  var fajr=sat(m.fajr,5/24,true),sunrise=sat(0.833,6/24,true),dhuhr=mid(12/24),asr=asrT(asrF,13/24),maghrib=sat(0.833,18/24,false);
  var isha=m.ishaMin?maghrib+(ram&&m.ishaMin===90?120:m.ishaMin)/60:sat(m.isha,18/24,false);
  var adj=tz-lng/15;
  return {fajr:fajr+adj,sunrise:sunrise+adj,dhuhr:dhuhr+adj,asr:asr+adj,maghrib:maghrib+adj,isha:isha+adj};
}
function tzOffset(tz,date){
  try{var f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
    var p={};f.formatToParts(date).forEach(function(x){p[x.type]=x.value});
    var asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second);
    return (asUTC-Math.floor(date.getTime()/1000)*1000)/3600000;
  }catch(e){return -date.getTimezoneOffset()/60}
}
function isRamadan(date){try{return parseInt(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{month:'numeric',timeZone:'UTC'}).format(date),10)===9}catch(e){return false}}
function loc(){
  if(S.city==='custom'){var c=S.custom;return {name:'موقع مخصص',lat:+c.lat,lng:+c.lng,tz:c.tz||DEVTZ}}
  var c2=CITIES[S.city]||CITIES.riyadh;return {name:c2[0],lat:c2[1],lng:c2[2],tz:c2[3]};
}
function nowParts(){var l=loc(),tz=tzOffset(l.tz,new Date()),d=new Date(Date.now()+tz*3600000);return {key:d.toISOString().slice(0,10),min:d.getUTCHours()*60+d.getUTCMinutes(),y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function times(off){
  var l=loc(),t0=new Date(Date.now()+off*86400000),tzNow=tzOffset(l.tz,t0),ld=new Date(t0.getTime()+tzNow*3600000);
  var y=ld.getUTCFullYear(),m=ld.getUTCMonth()+1,d=ld.getUTCDate(),noon=new Date(Date.UTC(y,m-1,d,12)),tz=tzOffset(l.tz,noon);
  var r=calc(julian(y,m,d)-l.lng/360,l.lat,l.lng,tz,METHODS[S.method]||METHODS.ummqura,+S.asr||1,isRamadan(noon));
  var out={key:y+'-'+pad(m)+'-'+pad(d),y:y,m:m,d:d,tz:tz,ok:true};
  ['fajr','sunrise','dhuhr','asr','maghrib','isha'].forEach(function(p){
    if(!isFinite(r[p])){out.ok=false;out[p]={min:0,ms:0};return}
    var mn=Math.round(r[p]*60);out[p]={min:mn,ms:Date.UTC(y,m-1,d)+(mn-tz*60)*60000};
  });

}

var ctx=null,mg=null,cur=null,bufs=new Map(),lib=[],idb=null,toneTimer=null;
function ensureCtx(){
  try{if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C()}
    if(ctx&&ctx.state==='suspended')return ctx.resume().catch(function(){});}catch(e){}
  return Promise.resolve();
}
function master(){if(!mg){mg=ctx.createGain();mg.connect(ctx.destination)}mg.gain.value=Math.max(0.05,Math.min(1,+S.vol||0.8));return mg}

  if(toneTimer){clearTimeout(toneTimer);toneTimer=null}
  if(cur){try{cur.stop()}catch(e){}cur=null}
  setPlaying(false);
}
function soundLabel(v){
  if(v==='none')return 'بدون صوت';
  if(v==='tone:chime')return 'جرس هادئ';if(v==='tone:bell')return 'جرس عميق';if(v==='tone:dawn')return 'نغمة الفجر';
  if(v&&v.indexOf('pre:')===0){var bi=builtin(v.slice(4));return bi?bi.name:'جرس هادئ'}
  if(v&&v.indexOf('lib:')===0){var r=lib.find(function(x){return 'lib:'+x.id===v});return r?r.name:'جرس هادئ'}
  return '';
}
function playTone(kind){
  var seqs={chime:[[880,0,1.3],[1318.5,.28,1.5],[1760,.56,2]],bell:[[523.25,0,2.6],[784,.02,2.3],[1046.5,.04,2]],dawn:[[392,0,1],[494,.38,1],[587,.76,1],[784,1.14,2.2]]};
  var t0=ctx.currentTime+0.03,bus=ctx.createGain();bus.connect(master());

  seqs[kind].forEach(function(n){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n[0];
    g.gain.setValueAtTime(0.0001,t0+n[1]);g.gain.linearRampToValueAtTime(.55,t0+n[1]+.03);g.gain.exponentialRampToValueAtTime(.0005,t0+n[1]+n[2]);
    o.connect(g);g.connect(bus);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.05);end=Math.max(end,n[1]+n[2])});
  cur={stop:function(){try{bus.disconnect()}catch(e){}}};
  toneTimer=setTimeout(function(){cur=null;setPlaying(false)},(end+.3)*1000);
}
var raws={};
function rawFor(v){
  if(v.indexOf('pre:')===0){
    var b=builtin(v.slice(4));if(!b)return Promise.resolve(null);
    if(!raws[v])raws[v]=fetch(b.url).then(function(r){if(!r.ok)throw new Error('x');return r.arrayBuffer()}).catch(function(){delete raws[v];return null});
    return raws[v];
  }
  var rec=lib.find(function(x){return 'lib:'+x.id===v});return Promise.resolve(rec?rec.data:null);
}

  var vs=PR.map(function(p){return S.alerts[p]}).concat([S.pre.sound,S.morning.sound,S.evening.sound,S.wird.sound]);

}
function getBuf(v){
  if(bufs.has(v))return Promise.resolve(bufs.get(v));
  return rawFor(v).then(function(d){
    if(!d)return null;
    return new Promise(function(ok,no){ctx.decodeAudioData(d.slice(0),ok,no)});
  }).then(function(b){if(b)bufs.set(v,b);return b});
}
function play(v){
  stopSound();
  if(!v||v==='none')return Promise.resolve(false);
  return ensureCtx().then(function(){
    if(!ctx){toast('المتصفح لا يدعم تشغيل الصوت');return false}
    if(v.indexOf('tone:')===0){playTone(v.slice(5));setPlaying(true,soundLabel(v));return ctx.state==='running'}
    if(v.indexOf('lib:')===0||v.indexOf('pre:')===0){
      if(v.indexOf('pre:')===0&&!raws[v])toast('جارٍ تحميل الأذان…');
      return getBuf(v).then(function(b){
        if(!b){toast('تعذّر تحميل هذا الأذان. تحقق من الاتصال.');return play('tone:chime')}
        var src=ctx.createBufferSource(),bus=ctx.createGain();src.buffer=b;src.connect(bus);bus.connect(master());src.start();
        cur={src:src,stop:function(){try{src.stop()}catch(e){}try{bus.disconnect()}catch(e){}}};
        src.onended=function(){if(cur&&cur.src===src){cur=null;setPlaying(false)}};
        setPlaying(true,soundLabel(v));return ctx.state==='running';
      }).catch(function(){toast('تعذّر تشغيل هذا الملف. جرّب ملفًا بصيغة mp3 أو m4a.');return false});
    }
    return false;
  });
}

var VIEWS={home:vHome,adhkar:vAdhkar,prayer:vPrayer,wird:vWird,alerts:vAlerts};
function render(keepScroll){
  var y=window.scrollY;$('#view').innerHTML=VIEWS[tab]();
  document.querySelectorAll('#tabs button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  head();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function go(t){tab=t;render(false)}

/* ---------- alerts ---------- */
var pendingSound=null;
function inQuiet(){
  if(!S.quiet.on)return false;
  var m=nowParts().min,f=toMin(S.quiet.from),t=toMin(S.quiet.to);
  return f<=t?(m>=f&&m<t):(m>=f||m<t);
}
function showAlert(title,body,goTab,goSet){
  var b='<h2>'+esc(title)+'</h2><p class="hint">'+esc(body)+'</p><div class="btns">';
  if(goTab)b+='<button class="btn" data-act="openAlert" data-go="'+goTab+'" data-set="'+(goSet||'')+'">افتح</button>';
  b+='<button class="btn ghost" data-act="closeAlert">إغلاق</button></div><div id="alertsnd"></div>';
  $('#alertbox').innerHTML=b;$('#alert').hidden=false;
  try{document.title='🔔 '+title}catch(e){}
}
function fire(ev){
  var isPrayer=ev.type==='prayer',isPre=ev.type==='pre';
  if(inQuiet()&&(!isPrayer||S.quiet.adhan))return;
  var snd,title,body,gt=null,gs=null,l=loc().name;
  if(isPrayer){snd=S.alerts[ev.p];title='حان الآن وقت صلاة '+PN[ev.p];body=clock(times(0)[ev.p].min)+' · '+l}
  else if(isPre){snd=S.pre.sound;title='بقي '+ar(S.pre.min)+' دقيقة على صلاة '+PN[ev.p];body='استعد للصلاة'}
  else if(ev.type==='morning'){snd=S.morning.sound;title='وقت أذكار الصباح';body='أذكار قصيرة تبدأ بها يومك';gt='adhkar';gs='morning'}
  else if(ev.type==='evening'){snd=S.evening.sound;title='وقت أذكار المساء';body='اختم يومك بذكر الله';gt='adhkar';gs='evening'}
  else{snd=S.wird.sound;title='وقت وردك القرآني';body='الصفحة '+ar(S.quran.page);gt='wird'}
  showAlert(title,body,gt,gs);buzz([200,100,200]);
  if(snd&&snd!=='none'){pendingSound=snd;play(snd).then(function(ok){if(!ok&&snd!=='none'&&ctx&&ctx.state!=='running'){var a=$('#alertsnd');if(a)a.innerHTML='<button class="btn small" data-act="replay">اضغط لتشغيل الصوت</button>'}})}
}
function events(){
  var ev=[];
  [0,1].forEach(function(o){
    var T=times(o);if(!T.ok)return;
    PR.forEach(function(p){
      ev.push({id:T.key+'|'+p,ms:T[p].ms,type:'prayer',p:p});
      if(S.pre.on&&S.pre.min>0)ev.push({id:T.key+'|pre'+S.pre.min+'|'+p,ms:T[p].ms-S.pre.min*60000,type:'pre',p:p});
    });
    ['morning','evening','wird'].forEach(function(k){
      if(!S[k].on)return;var mn=toMin(S[k].time);
      ev.push({id:T.key+'|'+k+'|'+S[k].time,ms:Date.UTC(T.y,T.m-1,T.d)+(mn-T.tz*60)*60000,type:k});
    });
  });
  return ev;
}
var lastMin=-1;
function tick(){
  var now=Date.now();
  events().forEach(function(ev){
    if(fired.has(ev.id))return;
    if(now>=ev.ms){fired.add(ev.id);S.fired.push(ev.id);if(S.fired.length>120)S.fired.splice(0,S.fired.length-120);save();if(now-ev.ms<90000)fire(ev)}
  });
  var cd=$('#cd');if(cd){var N=nextPrayer();cd.textContent=fmtCd(N.t.ms-now)}
  var np=nowParts();if(np.min!==lastMin){lastMin=np.min;head();if(tab==='home')render(true)}
}

/* ---------- wake lock ---------- */
var wl=null;
function applyWake(){
  try{
    if(S.wake&&navigator.wakeLock&&document.visibilityState==='visible'){navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}
    else if(wl){wl.release();wl=null}
  }catch(e){}
}
function applyLarge(){document.documentElement.style.setProperty('--scale',S.large?'1.22':'1')}

/* ---------- events ---------- */
document.addEventListener('pointerdown',function(){ensureCtx()},{once:false,passive:true});
document.addEventListener('visibilitychange',function(){applyWake();tick()});

document.addEventListener('change',function(e){
  var t=e.target,path=t.dataset&&t.dataset.path;if(!path)return;
  var v=t.type==='checkbox'?t.checked:(t.dataset.num!==undefined?+t.value:t.value);
  if(t.dataset.clamp){var r=t.dataset.clamp.split(',').map(Number);if(!isFinite(v))v=r[0];v=Math.max(r[0],Math.min(r[1],Math.round(v)))}
  setPath(path,v);preloadSelected();
  if(path==='city'){if(v!=='custom')S.method=CITIES[v][4];save();fired=new Set(S.fired)}
  if(path==='large')applyLarge();
  if(path==='wake')applyWake();
  if(path==='vol'){if(mg)mg.gain.value=v;return}
  if(/^(city|method|asr|custom\.|quran\.|goals\.)/.test(path)||path==='pre.on'||/\.on$/.test(path))render(true);
  if(path==='custom.lat'||path==='custom.lng'||path==='city'||path==='method'||path==='asr')head();
});

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  var act=t.dataset.act;
  if(!act&&t.dataset.tab){go(t.dataset.tab);return}
  var d=day();
  switch(act){
    case 'gotab':go(t.dataset.tab);break;
    case 'goset':ui.set=t.dataset.set;go('adhkar');break;
    case 'unlock':ensureCtx().then(function(){play('tone:chime').then(function(){render(true)})});break;
    case 'setz':ui.set=t.dataset.set;render(false);break;
    case 'zk':{var s=ui.set,i=+t.dataset.i,z=ADHKAR[s][i],c=(d[s][i]||0);if(c<z.n){c++;d[s][i]=c;save();buzz(c>=z.n?[30,40,30]:12)}
      var card=$('[data-i="'+i+'"].zk');if(card)card.outerHTML=zkCard(s,i);
      var dn=zkDone(s),L=ADHKAR[s].length;$('#zkh').textContent=ar(dn)+' من '+ar(L);$('#zkbar').innerHTML=progressBar(dn,L);break}
    case 'zkreset':{var s2=ui.set,i2=+t.dataset.i;d[s2][i2]=0;save();var c2=$('[data-i="'+i2+'"].zk');if(c2)c2.outerHTML=zkCard(s2,i2);var dn2=zkDone(s2);$('#zkh').textContent=ar(dn2)+' من '+ar(ADHKAR[s2].length);$('#zkbar').innerHTML=progressBar(dn2,ADHKAR[s2].length);break}
    case 'speak':{var zz=ADHKAR[ui.set][+t.dataset.i];try{var ss=window.speechSynthesis;if(!ss){toast('القراءة الصوتية غير متاحة على هذا الجهاز');break}ss.cancel();var u=new SpeechSynthesisUtterance(zz.x);u.lang='ar-SA';u.rate=0.8;ss.speak(u)}catch(er){toast('القراءة الصوتية غير متاحة')}break}
    case 'wirdDone':{var q=S.quran;d.pages=(d.pages||0)+q.perDay;q.page+=q.perDay;if(q.page>604){q.page=((q.page-1)%604)+1;q.khatmas++}save();render(true);toast('تقبّل الله منك');break}
    case 'plus1':{var q2=S.quran;d.pages=(d.pages||0)+1;q2.page+=1;if(q2.page>604){q2.page=1;q2.khatmas++}save();render(true);break}
    case 'tasSel':ui.tas=t.dataset.id;render(true);break;
    case 'tas':{d.cnt=d.cnt||{};d.cnt[ui.tas]=(d.cnt[ui.tas]||0)+1;save();buzz(10);var n=d.cnt[ui.tas],g=S.goals[ui.tas];$('#tasn').textContent=ar(n);$('#tasg').textContent='الهدف '+ar(g)+(n>=g?' · أتممته':'');if(n===g)buzz([40,60,40]);break}
    case 'tasReset':d.cnt=d.cnt||{};d.cnt[ui.tas]=0;save();render(true);break;
    case 'test':{var sel=document.querySelector('select[data-path="'+t.dataset.for+'"]');ensureCtx().then(function(){play(sel?sel.value:'tone:chime')});break}
    case 'playLib':ensureCtx().then(function(){play(t.dataset.v)});break;
    case 'applyFajr':S.alerts.fajr=t.dataset.v;save();preloadSelected();render(true);toast('تم تعيينه لأذان الفجر');break;
    case 'applyRest':['dhuhr','asr','maghrib','isha'].forEach(function(p){S.alerts[p]=t.dataset.v});save();preloadSelected();render(true);toast('تم تعيينه للظهر والعصر والمغرب والعشاء');break;
    case 'delLib':{var id=t.dataset.id,v='lib:'+id;stopSound();
      lib=lib.filter(function(x){return x.id!==id});bufs.delete(v);idbDel(id);
      PR.forEach(function(p){if(S.alerts[p]===v)S.alerts[p]='tone:chime'});['pre','morning','evening','wird'].forEach(function(k){if(S[k].sound===v)S[k].sound='tone:chime'});save();render(true);break}
    case 'addSound':addSound();break;
    case 'stopSound':stopSound();break;
    case 'replay':ensureCtx().then(function(){play(pendingSound)});break;
    case 'closeAlert':stopSound();$('#alert').hidden=true;document.title='وردي';break;
    case 'openAlert':{stopSound();$('#alert').hidden=true;document.title='وردي';if(t.dataset.set)ui.set=t.dataset.set;go(t.dataset.go);break}
  }
});

function addSound(){
  var name=($('#sname').value||'').trim(),f=$('#sfile').files&&$('#sfile').files[0];
  if(!f){toast('اختر ملف الصوت أولًا');return}
  if(f.size>20*1048576){toast('الملف أكبر من ٢٠ ميغابايت');return}
  if(!name)name=f.name.replace(/\.[^.]+$/,'');
  ensureCtx().then(function(){
    if(!ctx){toast('المتصفح لا يدعم تشغيل الصوت');return}
    return f.arrayBuffer().then(function(buf){
      return new Promise(function(ok,no){ctx.decodeAudioData(buf.slice(0),ok,no)}).then(function(){
        var rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,data:buf};
        return idbPut(rec).then(function(saved){rec.mem=!saved;lib.push(rec);render(true);toast(saved?'أُضيف إلى المكتبة':'أُضيف مؤقتًا. هذا المتصفح لا يحفظ الملفات.')});
      },function(){toast('تعذّر قراءة الملف. جرّب mp3 أو m4a أو wav.')});
    });
  });
}

/* ---------- boot ---------- */
applyLarge();head();render(false);applyWake();preloadSelected();
idbOpen().then(function(db){idb=db;return idbAll()}).then(function(rows){lib=rows;if(tab==='alerts')render(true)});
setInterval(tick,1000);tick();
})();

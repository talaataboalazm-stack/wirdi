name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www/sounds
          cp index.html www/
          cp *.mp3 www/sounds/
          npx esbuild native.js --bundle --format=iife --outfile=www/native.js

      - name: Create Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/res/raw
          for f in *.mp3; do b="${f%.mp3}"; cp "$f" "android/app/src/main/res/raw/${b//-/_}.mp3"; done
          cp tone_*.wav android/app/src/main/res/raw/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK and release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Sign AAB for Google Play
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar wirdi-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed AAB for Google Play
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-aab
          path: wirdi-release-signed.aab
